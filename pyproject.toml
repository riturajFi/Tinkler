[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinkler-agent"
version = "0.1.0"
description = "Minimal LangGraph repo agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=0.2.34,<1.0.0",
  "langchain-openai>=0.3.0,<1.0.0",
  "uvicorn>=0.30,<1.0.0",
]

[project.scripts]
tinkler = "tinkler_cli.__main__:main"
tinkler-backend = "tinkler_backend.__main__:main"

[tool.setuptools.packages.find]
include = ["agent*", "tinkler_cli*", "tinkler_backend*"]
