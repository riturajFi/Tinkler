[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acorn-notes"
version = "0.1.0"
description = "A tiny CLI note keeper backed by JSON"
requires-python = ">=3.11"

[project.scripts]
acorn-notes = "acorn_notes.cli:main"

[tool.setuptools.packages.find]
include = ["acorn_notes*"]
